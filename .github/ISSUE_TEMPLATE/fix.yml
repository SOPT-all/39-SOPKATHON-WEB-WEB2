name: 🐛 Fix
description: 버그 및 오류 수정 작업을 등록합니다.
title: "[Fix] "
labels: ["🐛 fix"]
body:
  - type: textarea
    id: work
    attributes:
      label: 🐛 문제 상황
      description: 발생한 문제와 기대한 동작을 설명해 주세요.
      placeholder: 화면 새로고침 후 선택한 값이 유지되지 않습니다.
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: 📌 세부 작업
      description: 확인하거나 수정할 작업을 체크리스트로 작성해 주세요.
      placeholder: "- [ ] 원인 확인\n- [ ] 오류 수정\n- [ ] 재현 테스트"
    validations:
      required: true
  - type: input
    id: branch_name
    attributes:
      label: 🌿 브랜치 기능명
      description: 이슈 번호를 제외하고 영문 소문자, 숫자, 하이픈(-)으로 작성해 주세요.
      placeholder: selected-value-restore
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: 🔗 참고 자료
      description: 오류 화면, 로그 또는 관련 문서가 있다면 첨부해 주세요.
