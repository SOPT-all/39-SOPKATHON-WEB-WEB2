name: PR title validation

on:
  pull_request:
    types: [opened, edited, reopened, ready_for_review]

concurrency:
  group: pr-title-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: PR 제목 검사
    if: ${{ !(github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'develop') }}
    runs-on: ubuntu-latest

    steps:
      - name: Validate title
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          script: |
            const marker = '<!-- pr-title-validation -->';
            const { owner, repo } = context.repo;
            const pullRequest = context.payload.pull_request;
            const issue_number = pullRequest.number;
            const titlePattern = /^(init|feat|fix|chore|docs):\s+\S.*$/;
            const isValid = titlePattern.test(pullRequest.title);

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 },
            );
            const previous = comments.find((comment) =>
              comment.body?.includes(marker),
            );

            if (isValid) {
              if (previous) {
                await github.rest.issues.deleteComment({
                  owner,
                  repo,
                  comment_id: previous.id,
                });
              }
              return;
            }

            const body = [
              marker,
              '### 📝 PR 제목을 확인해 주세요',
              '',
              `현재 제목: \`${pullRequest.title.replaceAll('`', '\\`')}\``,
              '',
              'PR 제목은 `타입: 내용` 형식으로 작성해 주세요.',
              '',
              '사용 가능한 타입은 `init`, `feat`, `fix`, `chore`, `docs`예요.',
              '',
              '예시:',
              '',
              '- `feat: 로그인 페이지 구현`',
              '- `fix: 새로고침 오류 수정`',
              '- `chore: GitHub Actions 설정`',
              '',
              '제목을 수정하면 이 댓글은 자동으로 삭제돼요. 제목이 잘못되어도 PR 작업과 머지는 막지 않아요.',
            ].join('\n');

            if (previous) {
              if (previous.body !== body) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: previous.id,
                  body,
                });
              }
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
